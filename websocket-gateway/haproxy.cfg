# HAProxy Configuration for VCOS WebSocket Gateway
# Provides load balancing with sticky sessions for WebSocket connections

global
    log stdout format raw daemon
    maxconn 50000
    user haproxy
    group haproxy
    daemon
    
    # TLS settings
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11 no-tls-tickets
    
    # Performance tuning
    tune.ssl.default-dh-param 2048
    tune.bufsize 16384
    maxconnrate 1000
    maxsessrate 1000
    
    # Stats socket for monitoring
    stats socket /var/run/haproxy.sock mode 660 level admin expose-fd listeners

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option http-server-close
    option forwardfor except 127.0.0.0/8
    option redispatch
    retries 3
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s
    timeout http-keep-alive 5s
    timeout check 5s
    timeout tunnel 3600s
    maxconn 30000

# Frontend for WebSocket connections
frontend ws_frontend
    bind *:8000
    bind *:8443 ssl crt /etc/haproxy/certs/vcos.pem alpn h2,http/1.1
    
    # HTTP/2 support
    alpn h2,http/1.1
    
    # HTTP/1.1 keep-alive for WebSocket upgrade
    option http-keep-alive
    
    # Logging
    log global
    option httplog
    
    # Rate limiting
    stick-table type string size 1m expire 30m store http_req_rate(10s),http_err_rate(10s)
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 100 }
    
    # WebSocket upgrade detection
    acl is_websocket hdr(Upgrade) -i websocket
    acl is_websocket hdr(Connection) -i upgrade
    
    # Route to appropriate backend based on path
    use_backend ws_crdt if is_websocket { path_beg /ws/crdt/ }
    use_backend ws_signaling if is_websocket { path_beg /ws/signaling/ }
    use_backend ws_presence if is_websocket { path_beg /ws/presence/ }
    use_backend ws_health if { path /health }
    use_backend ws_metrics if { path /metrics }
    
    default_backend ws_crdt

# Backend for CRDT WebSocket connections
backend ws_crdt
    mode http
    balance source
    stick-table type string size 1m expire 30m
    stick on src
    
    # Health checks
    option httpchk GET /health
    http-check expect status 200
    
    # WebSocket specific
    timeout tunnel 3600s
    timeout client 86400s
    timeout server 86400s
    
    # Server definitions (will be populated by service discovery)
    server-template ws-gateway 1-10 websocket-gateway:8001 check inter 10s fall 2 rise 3 weight 100

# Backend for Signaling WebSocket connections
backend ws_signaling
    mode http
    balance source
    stick-table type string size 1m expire 30m
    stick on src
    
    option httpchk GET /health
    http-check expect status 200
    
    timeout tunnel 3600s
    timeout client 86400s
    timeout server 86400s
    
    server-template ws-gateway 1-10 websocket-gateway:8001 check inter 10s fall 2 rise 3 weight 100

# Backend for Presence WebSocket connections
backend ws_presence
    mode http
    balance source
    stick-table type string size 1m expire 30m
    stick on src
    
    option httpchk GET /health
    http-check expect status 200
    
    timeout tunnel 3600s
    timeout client 86400s
    timeout server 86400s
    
    server-template ws-gateway 1-10 websocket-gateway:8001 check inter 10s fall 2 rise 3 weight 100

# Backend for Health checks
backend ws_health
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    
    server-template ws-gateway 1-10 websocket-gateway:8001 check inter 10s fall 2 rise 3 weight 100

# Backend for Metrics
backend ws_metrics
    mode http
    balance roundrobin
    option httpchk GET /metrics
    http-check expect status 200
    
    server-template ws-gateway 1-10 websocket-gateway:9091 check inter 10s fall 2 rise 3 weight 100

# Stats frontend
frontend stats_frontend
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats auth admin:password
    stats admin if TRUE