# Coturn Configuration for VCOS WebRTC TURN/STUN Server
# Production-ready configuration with ephemeral credentials

# Listener configuration
listening-port=3478
tls-listening-port=5349

# Listener IP addresses (0.0.0.0 = all interfaces)
listening-ip=0.0.0.0

# External IP configuration (required for cloud deployments)
# Use your public IP or leave commented for auto-detection
# external-ip=YOUR_PUBLIC_IP

# Realm for authentication
realm=vcos.io

# Authentication settings
# Use shared secret for ephemeral credentials (RFC 8656)
use-auth-secret
static-auth-secret=your-shared-secret-change-in-production

# Alternative: Static username/password (less secure)
# user=vcos:your-secure-password

# Certificate paths for TLS/TURNS
cert=/etc/turnserver/cert.pem
pkey=/etc/turnserver/key.pem

# Security settings
# Disable old TLS versions
no-tlsv1
no-tlsv1_1
no-sslv3
no-sslv2

# Cipher suites
cipher-list="ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"

# Port range for media relay
min-port=49152
max-port=65535

# Performance settings
# Maximum bandwidth per session (0 = unlimited)
# max-bps=1000000

# Maximum number of concurrent connections
# max-connections=10000

# Maximum number of allocation per user
# max-allocations=1000

# Logging
log-file=/var/log/turnserver.log
verbose
# Syslog
# syslog

# PID file
pidfile=/var/run/turnserver.pid

# Disable CLI
no-cli

# WebRTC specific settings
# Allow RFC 5766 TURN and RFC 6062 TURN-TCP
allow-channel-data

# Mobility with ICE (RFC 5245)
mobility

# Allocate address family
# allow-all-local-ip

# Network interface for relaying
# relay-ip=auto

# Loopback prevention
# no-loopback-peers

# Fingerprint
fingerprint

# LT Credential Mechanism
lt-cred-mech

# Nonce for STUN authentication
nonce=12h

# Stale nonce
stale-nonce=600

# Keep alive
keep-alive

# Stale timeout
stale-timeout=600

# Max allocations per user
# max-allocations-per-user=1000

# Per-user bandwidth limit
# user-quota=100

# Total bandwidth limit
# total-quota=1000

# Redis for shared state (optional)
# redis-userdb="ip=redis port=6379 db=0"

# OAuth (optional)
# oauth
# oauth-issuer=https://your-issuer.com
# oauth-audience=your-audience
# oauth-scopes=scope1,scope2

# REST API (optional)
# rest-api
# rest-api-port=8088
# rest-api-key=your-rest-api-key

# Prometheus metrics (optional)
# prometheus-port=9122

# Disable CLI
no-cli

# Thread count
# proc-user=turnserver
# proc-group=turnserver