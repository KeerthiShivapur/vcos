version: '3.8'

services:
  # Redis for PubSub and rate limiting
  redis:
    image: redis:7-alpine
    container_name: vcos-ws-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - vcos-ws-network

  # WebSocket Gateway (scaled)
  websocket-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vcos-ws-gateway
    ports:
      - "8001:8001"
      - "9091:9091"
    environment:
      - CONFIG_PATH=/app/config.yaml
      - GATEWAY_ID=${GATEWAY_ID:-gateway-1}
      - REGION=${REGION:-local}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=1
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - LOG_LEVEL=INFO
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
    networks:
      - vcos-ws-network
    deploy:
      placement:
        constraints:
          - node.role == worker

  # Load balancer (HAProxy)
  haproxy:
    image: haproxy:2.8-alpine
    container_name: vcos-ws-haproxy
    ports:
      - "8000:8000"
      - "8404:8404"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - websocket-gateway
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8404/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - vcos-ws-network

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: vcos-ws-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - vcos-ws-network

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:10.1.0
    container_name: vcos-ws-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - vcos-ws-network

  # Coturn TURN/STUN server
  coturn:
    image: coturn/coturn:4.6.2
    container_name: vcos-ws-coturn
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "5349:5349/udp"
      - "49152-65535:49152-65535/udp"
    environment:
      - TURN_SERVER_NAME=vcos.io
      - TURN_REALM=vcos.io
      - TURN_USERNAME=vcos
      - TURN_PASSWORD=${TURN_PASSWORD:-your-turn-password}
      - TURN_SECRET=${TURN_SECRET:-your-shared-secret}
      - EXTERNAL_IP=${EXTERNAL_IP:-auto}
      - MIN_PORT=49152
      - MAX_PORT=65535
    volumes:
      - ./turnserver.conf:/etc/turnserver.conf:ro
    networks:
      - vcos-ws-network

volumes:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  vcos-ws-network:
    driver: overlay
    attachable: true