<!DOCTYPE html>
<html>
<head>
    <title>VCOS Login Test</title>
</head>
<body>
    <h1>VCOS Login Test</h1>
    <form id="loginForm">
        <div>
            <label>Email: <input type="email" id="email" value="test@example.com" required></label>
        </div>
        <div>
            <label>Password: <input type="password" id="password" value="TestPass123!" required></label>
        </div>
        <button type="submit">Login</button>
    </form>
    <div id="result"></div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            document.getElementById('result').innerHTML = 'Logging in...';
            
            try {
                const response = await fetch('http://127.0.0.1:8000/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('result').innerHTML = `
                        <h3>Success!</h3>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    document.getElementById('result').innerHTML = `
                        <h3>Error (${response.status})</h3>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                document.getElementById('result').innerHTML = `
                    <h3>Network Error</h3>
                    <pre>${error.message}</pre>
                `;
            }
        });
    </script>
</body>
</html>
