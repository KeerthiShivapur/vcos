# LiveKit Cluster Kubernetes Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: livekit
  labels:
    name: livekit
    environment: production
    managed-by: kubectl
---
# RBAC for LiveKit
apiVersion: v1
kind: ServiceAccount
metadata:
  name: livekit-sa
  namespace: livekit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: livekit-role
  namespace: livekit
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets", "endpoints"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: livekit-rolebinding
  namespace: livekit
subjects:
  - kind: ServiceAccount
    name: livekit-sa
    namespace: livekit
roleRef:
  kind: Role
  name: livekit-role
  apiGroup: rbac.authorization.k8s.io