# VCOS fleet provisioning playbook (Phase 16)
# Bootstrap order: prerequisites -> secrets -> core apps -> observability -> DR.
---
- name: VCOS platform bootstrap
  hosts: k8s_controllers
  gather_facts: false
  vars_files:
    - group_vars/all.yaml

  tasks:
    - name: Create namespace
      kubernetes.core.k8s:
        name: vcos
        api_version: v1
        kind: Namespace
        state: present

    - name: Apply API deployment
      kubernetes.core.k8s:
        src: "{{ playbook_dir }}/../kubernetes/deployment-api.yaml"
        namespace: vcos
        state: present

    - name: Apply worker fleet + autoscaling
      kubernetes.core.k8s:
        src: "{{ playbook_dir }}/../kubernetes/deployment-worker.yaml"
        namespace: vcos
        state: present

    - name: Apply ingress
      kubernetes.core.k8s:
        src: "{{ playbook_dir }}/../kubernetes/ingress.yaml"
        namespace: vcos
        state: present

    - name: Install Prometheus stack
      kubernetes.core.helm:
        name: prometheus
        chart_ref: prometheus-community/kube-prometheus-stack
        release_namespace: monitoring
        state: present

    - name: Install Loki
      kubernetes.core.helm:
        name: loki
        chart_ref: grafana/loki-stack
        release_namespace: logging
        state: present

    - name: Install Tempo
      kubernetes.core.helm:
        name: tempo
        chart_ref: grafana/tempo
        release_namespace: tracing
        state: present

    - name: Schedule nightly backups
      kubernetes.core.k8s:
        src: "{{ playbook_dir }}/../backups/cronjob-backup.yaml"
        namespace: vcos
        state: present
