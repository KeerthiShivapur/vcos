# Secrets management (Phase 16.16) - Vault-backed, auto-rotated
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vcos-vault
  namespace: vcos
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/vcos-vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vcos-auth
  namespace: vcos
spec:
  method: aws
  mount: aws
  kubernetes: {}
  aws:
    role: vcos-vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vcos-secrets
  namespace: vcos
spec:
  mount: secret
  path: vcos/production
  refreshAfter: 1h
  destination:
    name: vcos-secrets
    create: true
---
# Rotation policy: keys rotate every 90 days, DB credentials every 30.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vcos-secret-rotation
  namespace: vcos
data:
  rotation.yaml: |
    secrets:
      - {name: database_password, cadence: 30d, rotate: dynamic-db-creds}
      - {name: redis_password, cadence: 30d, rotate: regenerate}
      - {name: api_signing_key, cadence: 90d, rotate: regenerate}
      - {name: jwt_secret, cadence: 90d, rotate: regenerate}
      - {name: provider_oauth_client_secret, cadence: 90d, rotate: rotate-client-secret}
    standby_rule: "secrets roll in failover region within 5 minutes"
