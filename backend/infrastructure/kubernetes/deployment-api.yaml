# API deployment - multi-AZ, anti-affinity, rolling blue-green capable (Phase 16)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vcos-api
  namespace: vcos
  labels:
    app: vcos-api
    vcos.io/strategy: blue_green
spec:
  replicas: 6
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: {app: vcos-api}
  template:
    metadata:
      labels:
        app: vcos-api
        vcos.io/version: "1.0.0"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector: {matchLabels: {app: vcos-api}}
                topologyKey: topology.kubernetes.io/zone
      containers:
        - name: api
          image: vcos/api:1.0.0
          ports: [{containerPort: 8000}]
          envFrom:
            - secretRef: {name: vcos-secrets}
            - configMapRef: {name: vcos-config}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: "500m", memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
---
apiVersion: v1
kind: Service
metadata:
  name: vcos-api
  namespace: vcos
spec:
  selector: {app: vcos-api}
  ports: [{port: 8000, targetPort: 8000}]
  type: ClusterIP
