# Prometheus - scrape the API, workers, and cluster exporters (Phase 16.23)
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: vcos-na-virginia

rule_files:
  - prometheus-rules.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: vcos-api
    metrics_path: /metrics
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: vcos-api
        action: keep

  - job_name: vcos-workers
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: vcos-workers
        action: keep

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter.vcos.svc.cluster.local:9187"]

  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter.vcos.svc.cluster.local:9121"]

  - job_name: opensearch-exporter
    static_configs:
      - targets: ["opensearch-exporter.vcos.svc.cluster.local:9114"]
