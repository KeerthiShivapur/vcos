# Alertmanager routing - page SRE for criticals, digest the rest (Phase 16.23)
route:
  group_by: ["vcos_event", "cluster"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: sre-team
  routes:
    - matchers: ["severity=critical"]
      receiver: sre-page
      continue: true
    - matchers: ["vcos_event=disaster.recovery.started"]
      receiver: sre-page

receivers:
  - name: sre-team
    slack_configs:
      - channel: "#vcos-sre"
        send_resolved: true
        api_url: "https://hooks.slack.com/services/T000/B000/XXXXXXXX"

  - name: sre-page
    pagerduty_configs:
      - service_key: "change-me"
        severity: critical
    email_configs:
      - to: "sre@vcos.io"
