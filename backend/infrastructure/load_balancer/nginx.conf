# Global load balancer - nearest-region routing + drain support (Phase 16.9)
# Mirrors regions_service.nearest_region: latency-based routing with
# failover when a region returns 503 on /health.
server {
    listen 80;
    server_name _;

    # Origin selection: weighted by region latency (Phase 16.3)
    upstream vcos_na_virginia {
        server api.na-virginia.vcos.io:8000 weight=100;  # 10ms
    }
    upstream vcos_eu_frankfurt {
        server api.europe-frankfurt.vcos.io:8000 weight=90;  # 15ms
    }
    upstream vcos_ap_singapore {
        server api.asia-singapore.vcos.io:8000 weight=80;  # 40ms
    }

    location / {
        proxy_pass http://vcos_na_virginia;
        proxy_next_upstream error timeout http_503 http_502;
        proxy_next_upstream_tries 3;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://vcos_na_virginia/health;
        proxy_next_upstream off;
    }

    # Rate limits per IP (Phase 16.10 API gateway tiering)
    limit_req_zone $binary_remote_addr zone=api:10m rate=200r/s;
    limit_req zone=api burst=400 nodelay;
}
