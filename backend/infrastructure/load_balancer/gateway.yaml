# ALB / Gateway API - path routing with per-service tiering (Phase 16.10)
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: vcos-gateway
  namespace: vcos
spec:
  gatewayClassName: aws-alb
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs: [{name: vcos-tls}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vcos-api-route
  namespace: vcos
spec:
  parentRefs: [{name: vcos-gateway}]
  rules:
    - matches: [{path: {type: PathPrefix, value: /api/v1}}]
      backendRefs:
        - name: vcos-api
          port: 8000
          weight: 100
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - {name: X-Edge-Location, value: "na-virginia"}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vcos-health-route
  namespace: vcos
spec:
  parentRefs: [{name: vcos-gateway}]
  rules:
    - matches: [{path: {type: Exact, value: /health}}]
      backendRefs:
        - name: vcos-api
          port: 8000
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - {name: X-Health-Status, value: "ok"}
