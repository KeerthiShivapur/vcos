# Fluent Bit - ships app + nginx + exporter logs to Loki (Phase 16.23)
service:
  flush: 1
  log_level: info
  parsers_file: parsers.conf

pipeline:
  inputs:
    - name: tail
      tag: vcos.*
      path: /var/log/containers/*.log
      multiline.parser: docker, cri

  filters:
    - name: kubernetes
      match: vcos.*
      kube_url: https://kubernetes.default.svc
      kube_tag_prefix: vcos.var.log.containers.
      labels: true

  outputs:
    - name: loki
      match: vcos.*
      host: loki
      port: 3100
      labels: job=fluentbit,cluster=vcos
      remove_keys: stream
      line_format: json
