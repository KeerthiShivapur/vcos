apiVersion: apps/v1
kind: Deployment
metadata:
  name: vcos-api
  namespace: vcos
  labels:
    app: vcos-api
    vcos.io/region: {{ .Values.region }}
    vcos.io/role: {{ .Values.role }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {app: vcos-api}
  template:
    metadata:
      labels:
        app: vcos-api
        vcos.io/region: {{ .Values.region }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image }}:{{ .Values.api.tag }}"
          ports: [{containerPort: 8000}]
          env:
            - {name: VCOS_REGION, value: {{ .Values.region | quote }}}
            - {name: VCOS_FAILOVER_ROLE, value: {{ .Values.role | quote }}}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vcos-api
  namespace: vcos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vcos-api
  minReplicas: 3
  maxReplicas: {{ .Values.api.replicasMax }}
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
---
apiVersion: v1
kind: Service
metadata:
  name: vcos-api
  namespace: vcos
spec:
  selector: {app: vcos-api}
  ports: [{port: 8000, targetPort: 8000}]
