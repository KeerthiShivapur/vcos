# VCOS local/edge stack - mirrors the Phase 16 production topology:
# API + workers behind a gateway, with per-cluster datastores and object storage.
version: "3.9"

x-api-env: &api-env
  DATABASE_URL: postgresql+asyncpg://vcos:vcos@database:5432/vcos
  REDIS_URL: redis://redis:6379/0
  SECRET_KEY: change-me-in-production
  APP_ENV: production

services:
  gateway:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes: [./load_balancer/nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [api]

  api:
    build: ../..
    environment: *api-env
    deploy:
      replicas: 3
      resources:
        limits: {cpus: "1.0", memory: 1G}

  worker:
    build: ../..
    command: ["python", "-m", "app.workers.runner"]
    environment: *api-env
    depends_on: [database, redis]

  database:
    image: postgres:16
    environment:
      POSTGRES_USER: vcos
      POSTGRES_PASSWORD: vcos
      POSTGRES_DB: vcos
    volumes: [pgdata:/var/lib/postgresql/data]
    command: ["postgres", "-c", "max_replication_slots=10", "-c", "wal_level=replica"]

  database_replica:
    image: postgres:16
    environment:
      POSTGRES_USER: vcos
      POSTGRES_PASSWORD: vcos
      POSTGRES_DB: vcos
    depends_on: [database]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--cluster-enabled", "no"]

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/vcos-neo4j

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: vcos
      MINIO_ROOT_PASSWORD: vcos-secret

volumes:
  pgdata:
