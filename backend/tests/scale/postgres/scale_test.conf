# PostgreSQL Scale-Test Configuration
#
# This configuration is optimized for large-scale data generation and validation
# in the VCOS scale-test suite. It should ONLY be used for scale testing,
# NEVER for production.
#
# Apply with: ALTER SYSTEM SET ...; SELECT pg_reload_conf();
# Or include via: include = 'tests/scale/postgres/scale_test.conf'
# Requires PostgreSQL restart for most settings.

# =============================================================================
# MEMORY SETTINGS (optimized for 16GB system, ~10GB available)
# =============================================================================

# shared_buffers: 25-40% of RAM. For 16GB with 10GB available, use ~1GB on Windows
# Windows needs contiguous memory for shared_buffers - 2GB+ is too large
shared_buffers = 1GB

# work_mem: per-operation memory for sorts, hashes, etc.
# For bulk COPY and large sorts during scale tests, increase significantly
# Each parallel worker can use up to work_mem, so be careful
work_mem = 256MB

# maintenance_work_mem: for VACUUM, CREATE INDEX, ALTER TABLE ADD FOREIGN KEY
# Critical for large index creation during scale tests
maintenance_work_mem = 2GB

# effective_cache_size: planner's estimate of OS cache size
# Should be ~50-75% of RAM = 8-12GB for 16GB system
effective_cache_size = 10GB

# =============================================================================
# WAL SETTINGS (optimized for bulk loading)
# =============================================================================

# max_wal_size: maximum WAL size between checkpoints
# Increase for bulk loads to reduce checkpoint frequency
max_wal_size = 4GB

# min_wal_size: minimum WAL size to retain
min_wal_size = 512MB

# checkpoint_timeout: time between automatic checkpoints
# Increase during bulk loads to reduce checkpoint overhead
checkpoint_timeout = 30min

# checkpoint_completion_target: spread checkpoint writes over time
checkpoint_completion_target = 0.9

# wal_buffers: WAL write buffer size
wal_buffers = 64MB

# wal_compression: compress WAL to reduce I/O
wal_compression = on

# wal_log_hints: enable full page writes for non-critical updates
wal_log_hints = on

# =============================================================================
# CHECKPOINT SETTINGS (optimized for bulk loading)
# =============================================================================

# checkpoint_timeout: increase to 30 minutes during bulk loads
checkpoint_timeout = 30min

# checkpoint_completion_target: spread writes over 90% of interval
checkpoint_completion_target = 0.9

# checkpoint_flush_after: flush after N pages during checkpoint
checkpoint_flush_after = 256kB

# =============================================================================
# VACUUM SETTINGS (optimized for large data volumes)
# =============================================================================

autovacuum = on
autovacuum_max_workers = 8
autovacuum_worker_slots = 16
autovacuum_naptime = 30s
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
autovacuum_vacuum_cost_delay = 10ms
autovacuum_vacuum_cost_limit = 1000

# =============================================================================
# PARALLEL QUERY SETTINGS
# =============================================================================

max_worker_processes = 16
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4
max_parallel_workers = 16
parallel_leader_participation = on

# =============================================================================
# QUERY PLANNER
# =============================================================================

# effective_cache_size: planner's estimate of OS cache
effective_cache_size = 10GB

# random_page_cost: SSD-optimized
random_page_cost = 1.1

# =============================================================================
# CONNECTION SETTINGS
# =============================================================================

max_connections = 200
superuser_reserved_connections = 5

# =============================================================================
# LOGGING FOR SCALE TESTS
# =============================================================================

log_min_duration_statement = 1000
log_checkpoints = on
log_autovacuum_min_duration = 0
log_temp_files = 0
log_timezone = 'UTC'

# =============================================================================
# STATISTICS
# =============================================================================

default_statistics_target = 500
track_io_timing = on
track_wal_io_timing = on